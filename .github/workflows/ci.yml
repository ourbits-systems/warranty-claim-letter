# Lint, test and package both browsers on pushes and pull requests to master.
# Tags like v0.2.0 also attach the store ZIPs to a draft GitHub release.
# Store submission itself stays manual (see store/chrome.md, store/firefox.md).
name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

      - name: Build and zip (Chrome, Firefox, Firefox sources)
        run: pnpm zip

      - name: Firefox add-on linter
        run: pnpm lint:firefox

      - name: Reproducible Firefox build
        run: |
          (cd .output/firefox-mv3 && find . -type f -exec sha256sum {} + | sort -k2) > first.txt
          rm -rf .output/firefox-mv3
          pnpm build:firefox
          (cd .output/firefox-mv3 && find . -type f -exec sha256sum {} + | sort -k2) > second.txt
          diff first.txt second.txt

      - uses: actions/upload-artifact@v7
        with:
          name: extension-zips
          path: .output/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: extension-zips
      - name: Draft GitHub release with the store ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.zip --draft --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Store packages for $GITHUB_REF_NAME"
